name: Diagnose npm token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: whoami
        run: npm whoami || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: org membership
        run: |
          echo "--- amrita ---"; npm org ls amrita --json || true
          echo "--- amritabot ---"; npm org ls amritabot --json || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
